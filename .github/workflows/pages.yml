name: Deploy ReadFlow Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/logo-name.jpeg'
      - 'public/icons/icon-128.png'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/assets
          cp -r site/* _site/
          cp assets/logo-name.jpeg _site/assets/logo-name.jpeg
          cp public/icons/icon-128.png _site/assets/icon-128.png
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
